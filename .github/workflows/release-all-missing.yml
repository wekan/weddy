name: Release All Missing

# Complete a release: build only the OS groups it lacks a file of, from the
# weddy-source-without-history.zip already on it, and upload only absent files.
#
#   gh workflow run release-all-missing.yml -R wekan/weddy
#   gh workflow run release-all-missing.yml -R wekan/weddy -f tag=<tag>

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to complete (empty = the newest release)'
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: weddy-release-${{ inputs.tag || 'newest' }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release-all-build.yml
    with:
      mode: missing
      tag: ${{ inputs.tag }}
